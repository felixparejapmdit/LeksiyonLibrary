<script>
const icons={home:'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',book:'<path d="M12 5c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Z"/><path d="M12 5v15"/>',archive:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v12h14V9M9 13h6"/>',pin:'<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/>',verse:'<path d="M5 3h14v18H5Z"/><path d="M8 7h8M8 11h8M8 15h4"/>',spark:'<path d="m12 2 2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4Z"/>',check:'<path d="m4 12 5 5L20 6"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',plus:'<path d="M12 4v16M4 12h16"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3"/><circle cx="16" cy="17" r="3"/>',folder:'<path d="M3 6h7l2 3h9v11H3Z"/>'};
const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.verse}</svg>`;
const esc=(v)=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routes={home:['Your study, thoughtfully gathered.','A quiet place to gather your lessons and prepare what comes next.'],archives:['All Archives','Every lesson and pastoral visit, in one considered collection.'],lessons:['Lesson Library','Find a lesson, revisit its source, and return to the thought that matters.'],visits:['Pastoral Visits','A living record of care, organized by date and congregation.'],lessonverses:['Verses from lessons','The passages behind your worship service lessons, with their source close at hand.'],verses:['Verse Library','Explore your collected passages, compare translations, and study with confidence.'],assistant:['Lesson Assistant','Bring your objectives into focus. Build the outline one thoughtful passage at a time.'],review:['Review Verses','Give each passage the care of a second look. Compare, correct, and confirm.'],import:['Import Verses','Bring a spreadsheet into your library with a clear check before anything is added.'],search:['Find a thought','Search across your collection, or follow a meaning to a related passage.'],settings:['Your workspace','Make this a comfortable place to read, prepare, and keep your study safe.']};
const lessons=[
{id:1,title:'A willing heart in everyday service',date:'Nov 8, 2026',year:'2026',type:'Weekend',verses:7,checked:false,issue:'Serving with purpose',objective:'Recognize opportunities to help others'},
{id:2,title:'Keeping our purpose in view',date:'Nov 4, 2026',year:'2026',type:'Midweek',verses:5,checked:true,issue:'Remaining focused',objective:'Set aside time for thoughtful preparation'},
{id:3,title:'Making room for thoughtful care',date:'Oct 25, 2026',year:'2026',type:'Pastoral Visit',verses:6,checked:true,local:'Sample Congregation',district:'Example District'},
{id:4,title:'Steadfast through changing seasons',date:'Oct 18, 2026',year:'2026',type:'Weekend',verses:8,checked:true,issue:'Finding steadiness',objective:'Practice patience in changing circumstances'},
{id:5,title:'Listening with understanding',date:'Sep 16, 2025',year:'2025',type:'Midweek',verses:4,checked:false,issue:'Understanding one another',objective:'Listen before responding'},
{id:6,title:'Encouragement for the week ahead',date:'Aug 17, 2025',year:'2025',type:'Pastoral Visit',verses:5,checked:true,local:'West Sample Congregation',district:'Example District'}];
const refs=['Genesis 6:8','II Hari 5:15','Roma 12:11','I Hari 8:61','Filipos 2:4','Awit 37:5','Juan 15:16','Colosas 3:23','Hebreo 10:24','II Timoteo 2:15','Mateo 5:16','I Pedro 4:10'];
const verses=refs.map((ref,i)=>({id:i+1,ref,number:[8,15,11,61,4,5,16,23,24,15,16,10][i],text:['Ang mga tagapag-ingat ay handang tumulong sa pamayanan.','Ang pagtitipon ay nagbigay ng pagkakataong makinig at matuto.','Bawat gawain ay ginagawa nang may malasakit at pag-iingat.','Ang mga kasama ay naglaan ng panahon upang maghanda.'][i%4],version:i%3===0?'T4T':i%3===1?'MBBTAG':'NIRV',source:i%2===1?'Lesson Library':i%4===0?'Imported from Excel':'Pastoral visit PDF',language:'Tagalog',verified:i%3!==0}));
const s={route:'home',q:'',year:'all',category:'All lessons',view:'cards',page:1,book:'all',status:'all',review:0,compared:false,reviewDraft:'',picked:[2,4],objectives:['Help listeners find purpose in everyday service'],lectureTitle:'A willing heart',suggested:false,saved:false,imported:false,importStep:1,soft:false,sourceTab:'original',searchMode:'words'};
const $=(sel)=>document.querySelector(sel);
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3500)}
function nav(){const item=(id,label,i,count,sub=false)=>`<button class="nav-button ${s.route===id?'active':''} ${sub?'sub':''}" data-route="${id}" ${s.route===id?'aria-current="page"':''}>${!sub?icon(i):''}<span>${label}</span>${count?`<span class="count">${count}</span>`:''}</button>`;$('#nav').innerHTML=item('home','Overview','home')+item('archives','All Archives','archive','6')+'<div class="eyebrow">Your collection</div>'+item('lessons','Lesson Library','book','4')+item('lessonverses','Verses from lessons','verse',String(verses.filter(v=>v.source==='Lesson Library').length),true)+item('visits','Pastoral Visits','pin','2')+item('verses','Verse Library','verse',String(verses.filter(v=>v.source!=='Lesson Library').length))+item('import','Import Verses','upload','',true)+'<div class="eyebrow">Prepare & care</div>'+item('assistant','Lesson Assistant','spark')+item('review','Review Verses','check',String(verses.filter(v=>!v.verified).length))+item('search','Search','search')+item('settings','Settings','settings')}
function go(route){s.route=routes[route]?route:'home';s.q='';s.year='all';s.category='All lessons';s.page=1;s.book='all';s.status='all';$('#sidebar').classList.remove('open');$('#nav-backdrop').classList.remove('show');if(location.hash.slice(1)!==s.route)history.replaceState(null,'','#'+s.route);render();window.scrollTo({top:0,behavior:'instant'})}
function heading(){let [title,desc]=routes[s.route];const action=['lessons','visits','archives'].includes(s.route)?`<button class="btn primary" data-action="upload">${icon('upload')}Upload ${s.route==='visits'?'visit':'lesson'}</button>`:s.route==='home'?`<button class="btn" data-action="backup">${icon('download')}Back up vault</button>`:s.route==='verses'||s.route==='lessonverses'?`<button class="btn" data-route="review">${icon('check')}Review passages</button>`:s.route==='assistant'?`<button class="btn" data-action="new-outline">${icon('plus')}New outline</button>`:s.route==='review'?`<span class="pill green">${verses.filter(v=>!v.verified).length} passages to check</span>`:'';return `<div class="breadcrumb">Workspace ${icon('chevron')} ${s.route==='home'?'Overview':title}</div><div class="page-intro"><div><h1>${title}</h1><p>${desc}</p></div><div class="row">${action}</div></div>`}
function footer(){return `<footer class="concept-footer"><span>EVERGREEN / 01 &nbsp; · &nbsp; Design preview · Illustrative data only</span><span>Explore another direction <a href="02-blueprint.html">02 Blueprint ↗</a><a href="03-nocturne.html">03 Nocturne ↗</a></span></footer>`}
const word=(v)=>`<sup>${v.number}</sup>${esc(v.text)}`;
function home(){return `<section class="hero"><div><span class="eyebrow">Gather. Reflect. Prepare.</span><h2>More room for<br>what matters.</h2><p>Your lessons are gathered. Your next thought is waiting. Pick up where you left off.</p><button class="btn" data-route="assistant">Continue preparing ${icon('arrow')}</button></div><div class="hero-art" aria-hidden="true"><div class="book-art"></div></div></section><section class="metrics" aria-label="Collection summary"><div class="metric"><strong>06</strong><span>Lessons & visits</span></div><div class="metric"><strong>12</strong><span>Collected passages</span></div><div class="metric"><strong>02</strong><span>Lessons to check</span></div><div class="metric"><strong>01</strong><span>Outline in progress</span></div></section><div class="home-grid"><section><div class="between section-heading"><h2 style="margin:0">Recently gathered</h2><button class="link-button" data-route="archives">View all archives ↗</button></div><div class="panel" style="padding:0 22px">${lessons.slice(0,3).map(l=>lessonRow(l,true)).join('')}</div><div class="between section-heading"><h2 style="margin:0">Your study desk</h2><span class="eyebrow">In progress</span></div><div class="panel between"><div><span class="pill green">Lecture outline</span><h3 class="serif" style="font-size:23px;margin-top:11px">A willing heart</h3><p class="small muted" style="margin-bottom:0">1 objective · 2 passages selected</p></div><button class="btn" data-route="assistant">Resume ${icon('arrow')}</button></div></section><aside><div class="section-heading"><h2>One step at a time</h2></div><div class="panel"><div class="task"><span class="task-number">1</span><div><h3>Check what was read</h3><p class="muted">Two uploaded lessons are ready for a closer look.</p><button class="link-button" data-action="detail" data-id="1">Check a lesson →</button></div></div><div class="task"><span class="task-number">2</span><div><h3>A second look at a passage</h3><p class="muted">Confirm a few verses before your next preparation.</p><button class="link-button" data-route="review">Begin review →</button></div></div><div class="task"><span class="task-number">3</span><div><h3>Keep your work safe</h3><p class="muted">A regular backup keeps your collection close.</p><button class="link-button" data-action="backup">Create a backup →</button></div></div></div><p class="small muted" style="padding:18px 7px;font-size:10px">A quieter workspace.<br>Built around reading, not managing.</p></aside></div>`}
function lessonRow(l,compact=false){return `<article class="lesson-row"><div class="document-icon">${icon(l.type==='Pastoral Visit'?'pin':'verse')}</div>${!compact?`<span class="date">${l.date}</span>`:''}<div class="grow"><h3>${l.title}</h3><p>${compact?l.date+' &nbsp; · &nbsp; ':''}${l.type} · ${l.verses} verses${l.local?' · '+l.local:''}</p></div><span class="pill ${l.checked?'green':'gold'}">${l.checked?'Checked':'To check'}</span><button class="btn quiet icon-only" data-action="detail" data-id="${l.id}" aria-label="Open ${l.title}">${icon('arrow')}</button></article>`}
function library(){const pastoral=s.route==='visits';const rows=lessons.filter(l=>(s.route==='archives'||(l.type==='Pastoral Visit')===pastoral)&&(s.year==='all'||l.year===s.year)&&(s.category==='All lessons'||l.type===s.category)&&(!s.q||`${l.title} ${l.local||''} ${l.district||''} ${l.issue||''} ${l.objective||''}`.toLowerCase().includes(s.q.toLowerCase())));return `${!pastoral?`<div class="tabs" role="tablist" aria-label="Lesson type">${['All lessons','Weekend','Midweek',...(s.route==='archives'?['Pastoral Visit']:[])].map(t=>`<button class="tab ${s.category===t?'active':''}" role="tab" aria-selected="${s.category===t}" data-action="category" data-value="${t}">${t}</button>`).join('')}</div>`:''}<div class="toolbar"><div class="search">${icon('search')}<input id="list-search" placeholder="${pastoral?'Find by title, congregation, or district…':'Find by title, issue, or objective…'}" value="${esc(s.q)}" aria-label="Filter lessons"></div><select class="field" id="sort-lessons" aria-label="Sort lessons"><option>Newest first</option><option>Title A–Z</option></select><button class="btn quiet compact" data-action="filter-detail">${icon('settings')}More filters</button></div><div class="between wrap"><div class="year-pills"><span class="small muted" style="margin-right:8px">Year</span>${['all','2026','2025'].map(y=>`<button class="year ${s.year===y?'active':''}" data-action="year" data-value="${y}">${y==='all'?'All years':y}</button>`).join('')}</div><span class="small muted" style="font-size:10px">${rows.length} ${pastoral?'pastoral visits':'lessons'}</span></div><div class="list-head between"><span>Your ${pastoral?'visits':'lessons'}</span><span>Date · Source · Status</span></div>${rows.length?`<div class="library-list">${rows.map(l=>lessonRow(l)).join('')}</div>`:'<div class="empty"><h2>No matching lessons</h2><p class="muted small">Try a different title or clear the filters.</p><button class="btn" data-action="clear">Clear filters</button></div>'}<div class="panel between wrap" style="margin-top:24px;border-style:dashed;background:transparent"><div class="row">${icon('upload')}<div><h3 style="font-size:12px">A new ${pastoral?'visit':'lesson'} for your collection?</h3><p class="muted small" style="font-size:10px;margin:0">Choose PDFs. A guided check comes next.</p></div></div><button class="btn compact" data-action="upload">Choose PDF files</button></div>`}
function filteredVerses(){return verses.filter(v=>(s.route==='lessonverses'?v.source==='Lesson Library':v.source!=='Lesson Library')&&(!s.q||`${v.ref} ${v.text} ${v.version}`.toLowerCase().includes(s.q.toLowerCase()))&&(s.book==='all'||v.ref.includes(s.book))&&(s.status==='all'||v.verified===(s.status==='verified')))}
function pager(total){const pages=Math.max(1,Math.ceil(total/4));s.page=Math.min(s.page,pages);return `<div class="pager"><span>${total?`${(s.page-1)*4+1}–${Math.min(s.page*4,total)} of ${total} passages`:'0 passages'}</span><div class="page-buttons"><button class="btn compact quiet" data-action="page" data-value="${s.page-1}" ${s.page===1?'disabled':''}>← <span class="hide-mobile">Previous</span></button>${Array.from({length:pages},(_,i)=>`<button class="page-num ${s.page===i+1?'active':''}" data-action="page" data-value="${i+1}" aria-label="Page ${i+1}" ${s.page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}<button class="btn compact quiet" data-action="page" data-value="${s.page+1}" ${s.page===pages?'disabled':''}>Next →</button></div></div>`}
function verseCard(v){return `<article class="verse-card"><div class="between"><h3>${v.ref}</h3><span class="pill ${v.verified?'green':'gold'}">${v.verified?icon('lock')+'Verified':'To review'}</span></div><div class="row" style="gap:6px"><span class="pill">${v.version}</span><span class="small muted" style="font-size:10px">Tagalog</span></div><p class="verse-words">${word(v)}</p><div class="verse-bottom"><span>${v.source}</span><div class="row" style="gap:7px"><button class="link-button" data-action="copy" data-id="${v.id}">Copy</button><button class="btn compact quiet" data-action="context" data-id="${v.id}" aria-label="View context for ${v.ref}">${icon('chevron')}</button></div></div></article>`}
function verseLibrary(){const all=filteredVerses();const pagerHtml=pager(all.length);const items=all.slice((s.page-1)*4,s.page*4);let body;if(s.view==='table')body=`<div class="table-wrap"><table><thead><tr><th>Reference</th><th>Version</th><th>Passage</th><th>Source</th><th>Status</th></tr></thead><tbody>${items.map(v=>`<tr><td style="white-space:nowrap"><button class="link-button" data-action="context" data-id="${v.id}">${v.ref}</button></td><td>${v.version}</td><td style="min-width:240px">${word(v)}</td><td>${v.source}</td><td><span class="pill ${v.verified?'green':'gold'}">${v.verified?'Verified':'To review'}</span></td></tr>`).join('')}</tbody></table></div>`;else if(s.view==='parallel')body=`<div class="stack">${items.map(v=>`<article class="parallel"><div><span class="eyebrow">Tagalog · ${v.version}</span><h3 style="margin-top:10px">${v.ref}</h3><p>${word(v)}</p><span class="pill green">${v.source}</span></div><div><span class="eyebrow">English · illustrative comparison</span><h3 style="margin-top:10px">${v.ref}</h3><p><sup>${v.number}</sup>The community made time to prepare, listen, and offer help to one another.</p><button class="link-button" data-action="context" data-id="${v.id}">View source & context →</button></div></article>`).join('')}</div>`;else body=`<div class="verse-grid">${items.map(verseCard).join('')}</div>`;return `<div class="toolbar"><div class="search">${icon('search')}<input id="verse-search" aria-label="Search passages" placeholder="Search a reference or a phrase…" value="${esc(s.q)}"></div><button class="btn compact" data-action="meaning">${icon('spark')}By meaning</button><div class="view-switch" aria-label="Verse layout">${['cards','table','parallel'].map(v=>`<button class="${s.view===v?'active':''}" aria-pressed="${s.view===v}" data-action="view" data-value="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div></div><div class="row wrap"><select class="field" id="book-filter" aria-label="Filter by book" style="width:auto;font-size:11px;min-width:140px"><option value="all">All books</option>${['Genesis','Hari','Roma','Juan'].map(b=>`<option ${s.book===b?'selected':''}>${b}</option>`).join('')}</select><select class="field" id="status-filter" aria-label="Filter by status" style="width:auto;font-size:11px"><option value="all">All statuses</option><option value="verified" ${s.status==='verified'?'selected':''}>Verified</option><option value="unverified" ${s.status==='unverified'?'selected':''}>To review</option></select><span class="small muted" style="margin-left:auto;font-size:10px">Original source is always preserved.</span></div>${pagerHtml}${all.length?body:'<div class="empty"><h2>No matching passages</h2><p class="small muted">Try another reference or clear your filters.</p><button class="btn" data-action="clear">Clear filters</button></div>'}${pagerHtml}<p class="small muted" style="font-size:9px">All passages shown in this design are illustrative wording, not scripture quotations.</p>`}
function assistant(){return `<div class="assistant-grid"><section><div class="panel"><div class="step-label"><span class="step-circle">1</span>BEGIN WITH YOUR OBJECTIVE</div><h2>What would you like to teach?</h2><label class="field-label" for="lecture-title">Outline title</label><input class="field" id="lecture-title" value="${esc(s.lectureTitle)}" placeholder="Give this preparation a name"><label class="field-label" for="objective-0">Objectives <span class="muted">· up to four</span></label>${s.objectives.map((o,i)=>`<div class="row" style="margin-bottom:9px"><span class="small muted">${String(i+1).padStart(2,'0')}</span><input class="field objective-field" id="objective-${i}" data-index="${i}" value="${esc(o)}" placeholder="What should listeners understand?"></div>`).join('')}<div class="between wrap" style="margin-top:14px"><button class="link-button" data-action="objective" ${s.objectives.length>=4?'disabled':''}>+ Add objective</button><button class="btn primary" data-action="suggest">${icon('spark')}Find passages</button></div></div><div class="between section-heading"><div><span class="step-label"><span class="step-circle">2</span>CHOOSE YOUR PASSAGES</span><h2 style="margin-top:7px;margin-bottom:0">${s.suggested?'Suggestions for your objective':'A place to begin'}</h2></div><span class="pill green">From your libraries</span></div><p class="small muted" style="font-size:10px">Only collected passages appear here. AI context is separate from the verse wording.</p>${verses.slice(0,s.suggested?5:3).map(v=>`<article class="suggestion"><div class="between"><h3>${v.ref}</h3><span class="pill">${v.version}</span></div><p>${word(v)}</p><div class="between"><span class="small muted" style="font-size:9px">${v.source}</span><button class="btn compact ${s.picked.includes(v.id)?'':'primary'}" data-action="pick" data-id="${v.id}">${icon(s.picked.includes(v.id)?'check':'plus')}${s.picked.includes(v.id)?'Added':'Add to outline'}</button></div><details style="margin-top:10px;font-size:10px;color:var(--muted)"><summary style="cursor:pointer">AI context · review before use</summary><p style="font-size:11px">Illustrative AI context for ${v.ref}. This note is not scripture and should be reviewed before teaching.</p></details></article>`).join('')}</section><aside class="outline-paper"><div class="between"><span class="eyebrow">Your lecture outline</span><span class="pill">${s.saved?'Saved in this preview':'Draft'}</span></div><h2 style="margin:21px 0 8px">${esc(s.lectureTitle||'Untitled outline')}</h2><p class="small muted" style="font-size:10px">${s.objectives.length} objective${s.objectives.length>1?'s':''} · ${s.picked.length} passages</p><div class="rule"></div><span class="eyebrow">Pasimula</span><p class="small" style="margin:10px 0 18px">${esc(s.objectives[0]||'Your first objective appears here.')}</p>${s.picked.length?s.picked.map((id,i)=>{let v=verses.find(x=>x.id===id);return `<div class="outline-item"><h3>${String.fromCharCode(65+i)}. ${v.ref} <span class="muted">${v.version}</span></h3><p>${word(v)}</p><div class="row"><button class="btn compact quiet" data-action="move" data-id="${id}" data-dir="-1" aria-label="Move ${v.ref} up" ${i===0?'disabled':''}>↑</button><button class="btn compact quiet" data-action="move" data-id="${id}" data-dir="1" aria-label="Move ${v.ref} down" ${i===s.picked.length-1?'disabled':''}>↓</button><button class="link-button" data-action="remove" data-id="${id}">Remove</button></div></div>`}).join(''):'<div class="empty"><p class="small muted">Add a passage from the suggestions to begin your outline.</p></div>'}<div class="rule"></div><div class="row wrap"><button class="btn primary grow" data-action="preview" ${s.picked.length?'':'disabled'}>Preview outline ${icon('arrow')}</button><button class="btn" data-action="save-outline">Save</button></div><p class="small muted" style="margin:13px 0 0;font-size:9px">Your selection and wording stay in your control.</p></aside></div>`}
function review(){let v=verses[s.review%verses.length];return `<div class="between wrap"><div class="view-switch"><button class="active" data-action="review-library" data-value="Verse Library">Verse Library</button><button data-action="review-library" data-value="Lesson Library">Lesson Library</button></div><span class="small muted">Passage ${s.review+1} of ${verses.length} · ${v.source}</span></div><div class="review-progress"><i style="width:${(s.review+1)/verses.length*100}%"></i></div><div class="review-grid"><section><div class="between" style="margin-bottom:14px"><span class="eyebrow">Original source</span><span class="pill">${v.source==='Imported from Excel'?'Sample verses.xlsx · row '+(s.review+2):'Sample visit.pdf · page 1'}</span></div><div class="source-paper"><p class="eyebrow" style="text-align:center;margin-bottom:25px">Illustrative source document</p><h3>MAKING TIME FOR THOUGHTFUL CARE</h3><p class="small" style="margin-top:25px">PASIMULA</p><p>1. A willing heart in everyday service</p><div class="source-highlight"><strong>${v.ref} · ${v.version}</strong><p style="margin:10px 0 0">${word(v)}</p></div><p class="muted small">Example wording for design review only. In the working app, the original PDF or spreadsheet cell is shown here.</p></div><button class="link-button" style="margin-top:16px" data-action="source-zoom">Open a larger source view ↗</button></section><section class="panel review-editor"><div class="between"><h2 style="margin:0">A careful comparison</h2><span class="pill ${v.verified?'green':'gold'}">${v.verified?'Verified':'Not yet verified'}</span></div><label class="field-label" for="review-ref">Reference</label><input class="field" id="review-ref" value="${esc(v.ref)}"><div class="row" style="margin:14px 0 0"><span class="pill">${v.version}</span><span class="small muted">Tagalog</span></div><p class="verse-words" style="margin:14px 0">${word(v)}</p><details style="margin:8px 0 18px;font-size:11px"><summary style="cursor:pointer;color:var(--green)">Correct the extracted wording</summary><label class="field-label" for="review-wording">Verse text</label><textarea class="field" id="review-wording">${esc(v.number+v.text)}</textarea><button class="btn compact" style="margin-top:9px" data-action="save-correction">Save correction</button></details><div class="rule"></div><label class="checkline"><input type="checkbox" id="compared" ${s.compared?'checked':''} ${v.verified?'disabled':''}><span>I compared this passage with the original source. The reference and wording match.</span></label><button class="btn primary" id="verify-button" data-action="verify" style="width:100%;margin-top:20px" ${!s.compared||v.verified?'disabled':''}>${icon('lock')}${v.verified?'This passage is verified':'Verify & lock passage'}</button><p class="muted small" style="font-size:9px;margin:12px 0 0">In the working app, verification permanently locks the verse. This design preview uses sample data only.</p></section></div><div class="between" style="margin-top:23px"><button class="btn" data-action="review-step" data-value="-1" ${s.review===0?'disabled':''}>← Previous passage</button><button class="btn" data-action="review-step" data-value="1">Skip for now →</button></div>`}
function imports(){return `<div class="steps"><span class="${s.importStep===1?'active':''}"><b class="step-circle">1</b>Choose file</span><i></i><span class="${s.importStep===2?'active':''}"><b class="step-circle">2</b>Check preview</span><i></i><span class="${s.importStep===3?'active':''}"><b class="step-circle">3</b>Add to library</span></div>${s.importStep===1?`<div class="upload-zone">${icon('upload')}<h2>Your collection, one file closer.</h2><p>Choose an Excel workbook. Review its passages before they join your library.</p><div class="row wrap" style="justify-content:center"><button class="btn primary" data-action="browse-sheet">Choose Excel file</button><button class="btn" data-action="sample-sheet">Try a sample spreadsheet</button></div><span class="small muted" style="display:block;margin-top:13px;font-size:9px">.xlsx or .xls · Your file stays on your computer.</span></div><div class="home-grid" style="margin-top:25px"><section class="panel"><h2 style="font-size:23px">A simple sheet is all you need.</h2><p class="small muted">Include these columns in the first row, in any order.</p><div class="row wrap">${['Translation','Book','Chapter','Verse','Content'].map(x=>`<span class="pill">${x}</span>`).join('')}</div></section><aside class="panel"><span class="eyebrow">Worth knowing</span><p class="small muted" style="margin:12px 0 0">Possible book-name errors and duplicate passages are shown in the preview. Nothing is added until you confirm.</p></aside></div>`:s.importStep===2?`<div class="panel between wrap" style="margin-bottom:20px"><div><span class="eyebrow">Ready for a closer look</span><h2 style="margin:6px 0 0">4 passages ready to add</h2></div><span class="pill green">sample-verses.xlsx</span></div><div class="notice" style="margin-bottom:19px">One OCR label was corrected from TAT to T4T. All four passages will need your review after import.</div><div class="table-wrap"><table><thead><tr><th>Book</th><th>Chapter / Verse</th><th>Translation</th><th>Content preview</th></tr></thead><tbody>${verses.slice(0,4).map(v=>`<tr><td>${v.ref.replace(/ \d+:\d+$/,'')}</td><td>${v.ref.match(/\d+:\d+$/)[0]}</td><td>${v.version}</td><td>${word(v)}</td></tr>`).join('')}</tbody></table></div><div class="between" style="margin-top:22px"><button class="btn" data-action="cancel-import">Choose another file</button><button class="btn primary" data-action="commit-import">Add 4 sample passages ${icon('arrow')}</button></div>`:`<div class="empty" style="border-style:solid;padding:60px 30px"><div style="color:var(--green);margin-bottom:18px">${icon('check')}</div><h2>Ready for your next study.</h2><p class="small muted">The sample import is complete. In the working app, these passages would now appear unverified in the Verse Library.</p><button class="btn primary" data-route="verses">Open Verse Library ${icon('arrow')}</button><button class="btn quiet" data-action="cancel-import">Import another file</button></div>`}`}
function search(){let matches=verses.filter(v=>!s.q||`${v.ref} ${v.text}`.toLowerCase().includes(s.q.toLowerCase()));let ls=lessons.filter(l=>s.q&&l.title.toLowerCase().includes(s.q.toLowerCase()));if(s.searchMode==='meaning'&&s.q)matches=verses.slice(0,3);return `<section class="search-hero"><span class="eyebrow">Across your whole collection</span><h2>Follow a thought.</h2><div class="search-large">${icon('search')}<input id="full-search" aria-label="Search your collection" value="${esc(s.q)}" placeholder="A reference, a word, or an idea…"><button class="btn primary" data-action="run-search">Search</button></div><div class="search-terms">${['service','II Hari','listening','Genesis'].map(q=>`<button data-action="search-term" data-value="${q}">${q}</button>`).join('')}</div></section><div class="between section-heading"><div class="view-switch"><button class="${s.searchMode==='words'?'active':''}" data-action="search-mode" data-value="words">By wording</button><button class="${s.searchMode==='meaning'?'active':''}" data-action="search-mode" data-value="meaning">${icon('spark')}By meaning</button></div><span class="small muted">${s.q?`${matches.length+ls.length} sample matches`:'A few places to begin'}</span></div>${s.searchMode==='meaning'?'<div class="notice" style="margin-bottom:17px">Illustrative meaning matches. In the working app, the local AI finds passages in your own libraries.</div>':''}${ls.map(l=>`<div class="search-result between"><div><span class="eyebrow">Lesson</span><h3 style="margin-top:7px">${l.title}</h3><span class="small muted">${l.date} · ${l.type}</span></div><button class="btn" data-action="detail" data-id="${l.id}">Open ${icon('arrow')}</button></div>`).join('')}${matches.slice(0,4).map(v=>`<article class="search-result"><div class="between"><h3 class="serif" style="font-size:22px">${v.ref}</h3><span class="pill">${v.version}</span></div><p>${word(v)}</p><div class="between"><span class="small muted" style="font-size:9px">${v.source}</span><button class="link-button" data-action="context" data-id="${v.id}">Source & context →</button></div></article>`).join('')}${!matches.length&&!ls.length?'<div class="empty"><h2>No matching thoughts yet.</h2><p class="small muted">Try a broader phrase, a book name, or meaning search.</p></div>':''}`}
function settings(){return `<div class="settings-grid"><section class="panel"><span class="eyebrow">Make yourself comfortable</span><h2 style="margin-top:8px">Reading & appearance</h2><div class="setting-row"><div><h3>Soft reading colors</h3><p>A gentler paper tone for a longer study.</p></div><button class="switch ${s.soft?'on':''}" data-action="soft" aria-label="Soft reading colors" role="switch" aria-checked="${s.soft}"></button></div><div class="setting-row"><div><h3>Default language</h3><p>For context and lecture headings.</p></div><select class="field" id="language-setting" style="width:auto;font-size:11px" aria-label="Default language"><option>Tagalog</option><option>English</option></select></div><div class="setting-row"><div><h3>Comfortable text</h3><p>More space around passages and controls.</p></div><button class="switch on" data-action="density" aria-label="Comfortable text" role="switch" aria-checked="true"></button></div></section><section class="panel"><span class="eyebrow">A little peace of mind</span><h2 style="margin-top:8px">Backup & data</h2><div class="setting-row"><div><h3>Encrypted backups</h3><p>Keep a separate copy of your collection.</p></div><button class="btn compact" data-action="backup">Back up</button></div><div class="setting-row"><div><h3>Restore your collection</h3><p>Open a backup from a previous workspace.</p></div><button class="btn compact" data-action="restore">Restore</button></div><div class="setting-row"><div><h3>Local workspace</h3><p>This preview never opens or changes your vault.</p></div><span class="pill green">Sample only</span></div></section><section class="panel"><span class="eyebrow">Thoughtful assistance</span><h2 style="margin-top:8px">Local AI</h2><div class="setting-row"><div><h3>Context & meaning search</h3><p>Runs on your computer in the working app.</p></div><span class="pill green"><span class="dot"></span>Preview</span></div><p class="small muted" style="font-size:11px;margin-top:18px">AI context is clearly labelled, folded away, and reviewed separately from the actual verse.</p><button class="btn compact" data-action="ai-settings">Configure local AI</button></section><section class="panel"><span class="eyebrow">This design direction</span><h2 style="margin-top:8px">Calm by intention.</h2><p class="small muted">Warm paper, forest green, and a generous reading rhythm. The next action is always close, while deeper controls stay out of the way until needed.</p><div class="row wrap"><a class="btn compact" href="02-blueprint.html">Explore Blueprint ↗</a><a class="btn compact" href="03-nocturne.html">Explore Nocturne ↗</a></div></section></div>`}
function render(){nav();let body=s.route==='home'?home():['archives','lessons','visits'].includes(s.route)?library():['verses','lessonverses'].includes(s.route)?verseLibrary():s.route==='assistant'?assistant():s.route==='review'?review():s.route==='import'?imports():s.route==='search'?search():settings();$('#main').innerHTML=heading()+body+footer();$('#main').dataset.currentView=s.route;document.querySelectorAll('[data-route]').forEach(el=>el.dataset.view=el.dataset.route);document.title=`${routes[s.route][0]} · Evergreen · Lesson Vault`;bindInputs()}
function rerenderInput(id,fn){const el=document.getElementById(id);if(!el)return;el.addEventListener('input',()=>{const pos=el.selectionStart;fn(el.value);render();const next=document.getElementById(id);if(next){next.focus();if(next.setSelectionRange)next.setSelectionRange(pos,pos)}})}
function bindInputs(){rerenderInput('list-search',v=>s.q=v);rerenderInput('verse-search',v=>{s.q=v;s.page=1});rerenderInput('full-search',v=>s.q=v);$('#book-filter')?.addEventListener('change',e=>{s.book=e.target.value;s.page=1;render()});$('#status-filter')?.addEventListener('change',e=>{s.status=e.target.value;s.page=1;render()});$('#lecture-title')?.addEventListener('input',e=>{s.lectureTitle=e.target.value;s.saved=false});document.querySelectorAll('.objective-field').forEach(el=>el.addEventListener('input',e=>s.objectives[Number(el.dataset.index)]=e.target.value));$('#compared')?.addEventListener('change',e=>{s.compared=e.target.checked;$('#verify-button').disabled=!s.compared});$('#sort-lessons')?.addEventListener('change',e=>{if(e.target.value==='Title A–Z')lessons.sort((a,b)=>a.title.localeCompare(b.title));else lessons.sort((a,b)=>a.id-b.id);render()});$('#language-setting')?.addEventListener('change',e=>toast(`${e.target.value} selected for this preview.`))}
function modal(title,content,actions=''){const dlg=$('#dialog');dlg.innerHTML=`<div class="modal-head"><h2 id="dialog-title">${title}</h2><button class="btn quiet icon-only" data-action="close" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-content">${content}</div><div class="modal-foot"><button class="btn" data-action="close">Close</button>${actions}</div>`;if(!dlg.open)dlg.showModal()}
function detail(id){const l=lessons.find(x=>x.id===id);const v=verses[(id-1)%verses.length];modal('Check what was read',`<div class="modal-doc"><div class="source-paper"><span class="eyebrow">Sample PDF · page 1 of 2</span><h3 style="margin-top:25px">${l.title.toUpperCase()}</h3><p style="margin-top:25px">PASIMULA</p><p>A lesson for thoughtful preparation.</p><div class="source-highlight"><strong>${v.ref} · ${v.version}</strong><p style="margin:9px 0">${word(v)}</p></div><span class="small muted">Illustrative layout; not a real lesson document.</span></div><div><span class="pill ${l.checked?'green':'gold'}">${l.checked?'Already checked':'Ready to check'}</span><label class="field-label" for="detail-title">Title</label><input class="field" id="detail-title" value="${esc(l.title)}"><div class="row"><div class="grow"><label class="field-label" for="detail-date">Date</label><input class="field" id="detail-date" type="date" value="2026-11-08"></div><div class="grow"><label class="field-label" for="detail-kind">Category</label><select class="field" id="detail-kind"><option>${l.type}</option><option>Weekend</option><option>Midweek</option><option>Pastoral Visit</option></select></div></div>${l.local?`<label class="field-label" for="detail-local">Local congregation</label><input class="field" id="detail-local" value="${l.local}"><label class="field-label" for="detail-district">District</label><input class="field" id="detail-district" value="${l.district}">`:`<label class="field-label" for="detail-objective">Objective</label><textarea class="field" id="detail-objective">${l.objective||'Prepare with purpose and care'}</textarea>`}<div class="rule"></div><h3>Passages found <span class="muted">(${l.verses})</span></h3><p class="small">${v.ref} <span class="pill">${v.version}</span></p><p class="small" style="line-height:1.9">${word(v)}</p><label class="checkline"><input type="checkbox" id="checked-lesson"><span>I compared the title, details, and passages with the source.</span></label></div></div>`,`<button class="btn primary" data-action="confirm-lesson" data-id="${id}">Confirm this sample</button>`)}
function context(id){const v=verses.find(x=>x.id===id);modal('Passage & context',`<div class="between"><h2 style="margin:0">${v.ref}</h2><span class="pill">${v.version} · Tagalog</span></div><p style="font-size:18px;line-height:1.9;margin:22px 0">${word(v)}</p><span class="pill green">${v.source}</span><div class="rule"></div><div class="notice">AI context · not scripture · review before use</div><h3 style="margin-top:22px">Chapter context</h3><p class="small muted">This is a design example of a short, clearly separated context note. Official book names stay consistent, including I Hari and II Hari.</p><h3>Book & historical context</h3><p class="small muted">Longer background notes stay folded until requested, so the actual passage remains the focus.</p><button class="btn compact" data-action="review-this" data-id="${id}">Review this passage →</button>`,`<button class="btn primary" data-action="pick" data-id="${id}">Add to outline</button>`)}
function preview(){modal('Your outline, ready to read',`<div class="source-paper" style="max-width:620px;margin:auto;padding:34px 38px"><span class="eyebrow">Lecture outline · design sample</span><h2 style="text-align:center;margin:23px 0">${esc(s.lectureTitle||'Untitled outline')}</h2><p><strong>Mga layunin</strong></p>${s.objectives.map((o,i)=>`<p>${i+1}. ${esc(o)}</p>`).join('')}<h3 style="margin-top:25px">PASIMULA</h3>${s.picked.map((id,i)=>{const v=verses.find(x=>x.id===id);return `<p style="margin-top:20px"><strong>${String.fromCharCode(65+i)}. ${v.ref} · ${v.version}</strong></p><p style="line-height:1.9">${word(v)}</p>`}).join('')}<p class="small muted" style="border-top:1px solid var(--line);padding-top:18px;margin-top:30px">Illustrative passages for interface review only.</p></div>`,`<button class="btn" data-action="word-export">Word file</button><button class="btn primary" data-action="print">Print preview</button>`)}
document.addEventListener('click',async e=>{const route=e.target.closest('[data-route]');if(route){go(route.dataset.route);return}const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,id=Number(el.dataset.id),value=el.dataset.value;switch(a){case'menu':$('#sidebar').classList.toggle('open');$('#nav-backdrop').classList.toggle('show');break;case'page':s.page=Number(value);render();window.scrollTo({top:120,behavior:'smooth'});break;case'view':s.view=value;s.page=1;render();break;case'year':s.year=value;render();break;case'category':s.category=value;render();break;case'clear':s.q='';s.year='all';s.category='All lessons';s.book='all';s.status='all';s.page=1;render();break;case'detail':detail(id);break;case'context':context(id);break;case'close':$('#dialog').close();break;case'upload':modal('Gather a new lesson',`<div class="upload-zone">${icon('upload')}<h2>A place for your next PDF.</h2><p>This preview can open a file picker. No files are uploaded or stored.</p><button class="btn primary" data-action="browse-pdf">Choose PDF files</button></div><div class="rule"></div><h3>What comes next</h3><p class="small muted">1. Choose your files &nbsp; 2. Read the extracted details &nbsp; 3. Compare with the source</p>`);break;case'browse-pdf':$('#file-picker').accept='.pdf';$('#file-picker').dataset.kind='pdf';$('#file-picker').click();break;case'browse-sheet':$('#file-picker').accept='.xlsx,.xls';$('#file-picker').dataset.kind='sheet';$('#file-picker').click();break;case'sample-sheet':s.importStep=2;render();break;case'cancel-import':s.importStep=1;render();break;case'commit-import':s.importStep=3;s.imported=true;render();toast('Sample import complete. Your real library is unchanged.');break;case'confirm-lesson':if(!$('#checked-lesson').checked){toast('Please compare the sample details and tick the confirmation first.');break}lessons.find(l=>l.id===id).checked=true;$('#dialog').close();render();toast('Sample lesson marked as checked.');break;case'backup':modal('Keep a copy of your study',`<p class="muted small">In the working app, this creates an encrypted backup of your collection. Here, you can explore the flow without accessing your vault.</p><label class="field-label" for="backup-pass">Choose a backup passphrase</label><input class="field" id="backup-pass" type="password" placeholder="A memorable, strong passphrase"><p class="small muted" style="margin:15px 0 0">Keep your backup in a safe place outside this computer.</p>`,`<button class="btn primary" data-action="backup-demo">Create sample backup</button>`);break;case'backup-demo':$('#dialog').close();toast('Backup flow previewed. No real vault data was accessed.');break;case'restore':modal('Restore from a backup',`<div class="notice">In the working app, restoring replaces the current vault. This preview never changes your data.</div><p class="small muted" style="margin-top:20px">Choose an encrypted backup and enter its passphrase to review the restore steps.</p>`,`<button class="btn primary" data-action="restore-demo">Preview restore steps</button>`);break;case'restore-demo':toast('Demo restore: choose backup → enter passphrase → confirm replacement.');break;case'objective':if(s.objectives.length<4){s.objectives.push('');render();document.getElementById('objective-'+(s.objectives.length-1)).focus()}break;case'suggest':s.suggested=true;render();toast('Sample passages matched to your objective.');break;case'pick':if(!s.picked.includes(id)){s.picked.push(id);s.saved=false;toast('Passage added to your sample outline.')}else toast('This passage is already in your outline.');if(s.route==='assistant')render();break;case'remove':s.picked=s.picked.filter(x=>x!==id);render();break;case'move':{let i=s.picked.indexOf(id),j=i+Number(el.dataset.dir);if(j>=0&&j<s.picked.length)[s.picked[i],s.picked[j]]=[s.picked[j],s.picked[i]];render();break}case'new-outline':s.picked=[];s.objectives=[''];s.lectureTitle='';s.suggested=false;s.saved=false;render();toast('A fresh sample outline is ready.');break;case'save-outline':if(!s.lectureTitle.trim()){toast('Give your outline a title before saving.');$('#lecture-title').focus();break}s.saved=true;render();toast('Outline saved for this preview session.');break;case'preview':preview();break;case'word-export':toast('Word export preview. The working app creates a formatted .docx file.');break;case'print':window.print();break;case'copy':{const v=verses.find(v=>v.id===id);try{await navigator.clipboard.writeText(`${v.ref} (${v.version})\n${v.number}${v.text}`);toast('Sample passage copied.')}catch{modal('Copy this sample passage',`<p>${v.ref} (${v.version})</p><p style="user-select:all">${esc(v.number+v.text)}</p><span class="small muted">Select the passage above to copy it.</span>`)}break}case'review-step':s.review=(s.review+Number(value)+verses.length)%verses.length;s.compared=false;render();break;case'verify':{const v=verses[s.review%verses.length];if(!s.compared)break;modal('Confirm your comparison',`<p>Mark <strong>${v.ref}</strong> as verified in this sample?</p><p class="small muted">In the working app, the verse is permanently locked after confirmation. Only this preview's illustrative status will change.</p>`,`<button class="btn primary" data-action="verify-confirm">Verify sample passage</button>`);break}case'verify-confirm':verses[s.review%verses.length].verified=true;s.compared=false;$('#dialog').close();render();toast('Sample passage verified. You can move to the next one.');break;case'review-this':$('#dialog').close();s.review=verses.findIndex(v=>v.id===id);s.compared=false;go('review');break;case'save-correction':{let v=verses[s.review%verses.length];if(v.verified){toast('Verified passages stay locked. Choose an unverified sample to explore editing.');break}v.ref=$('#review-ref').value.trim()||v.ref;v.text=$('#review-wording').value.replace(/^\d+/,'').trim()||v.text;render();toast('Correction saved in this preview only.');break}case'source-zoom':{const v=verses[s.review%verses.length];modal('Original source · enlarged',`<div class="source-paper" style="font-size:18px"><span class="eyebrow">Illustrative source</span><h2 style="margin-top:20px">${v.ref} · ${v.version}</h2><p style="line-height:2">${word(v)}</p></div>`);break}case'review-library':toast(`${value} selected. The preview uses the same illustrative review queue.`);break;case'soft':s.soft=!s.soft;document.body.classList.toggle('soft',s.soft);render();break;case'density':el.classList.toggle('on');el.setAttribute('aria-checked',el.classList.contains('on'));toast('Reading density preference previewed.');break;case'ai-settings':modal('Local assistance, with clear boundaries',`<p class="small muted">Choose a local model for context and meaning search in the working app. Scripture wording always comes from your collection.</p><label class="field-label" for="ai-model">Context model</label><select class="field" id="ai-model"><option>llama3.2:3b · example</option></select><div class="notice" style="margin-top:20px">AI context remains marked as AI until reviewed. I Hari, II Hari, and translation labels stay consistent.</div>`,`<button class="btn primary" data-action="ai-save">Save preview preference</button>`);break;case'ai-save':$('#dialog').close();toast('AI preference previewed. No model or setting was changed.');break;case'meaning':toast('Meaning search would match your phrase against your own library using local AI.');if(!s.q)$('#verse-search').focus();break;case'search-term':s.q=value;render();break;case'search-mode':s.searchMode=value;render();break;case'run-search':render();toast(s.q?'Search results updated.':'Type a word, reference, or idea to begin.');break;case'filter-detail':modal('A more specific search',`<p class="small muted">Keep the familiar quick filters visible, and use these only when you need them.</p><div class="row"><div class="grow"><label class="field-label" for="date-from">From</label><input class="field" id="date-from" type="date"></div><div class="grow"><label class="field-label" for="date-to">To</label><input class="field" id="date-to" type="date"></div></div><label class="field-label" for="extra-filter">${s.route==='visits'?'Local congregation or district':'Issue or objective'}</label><input class="field" id="extra-filter" placeholder="Narrow down your collection">`,`<button class="btn primary" data-action="apply-filter">Apply filters</button>`);break;case'apply-filter':s.q=$('#extra-filter').value;$('#dialog').close();render();toast('Sample title and metadata filter applied. Date controls are for preview.');break}});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  if(el.dataset.action==='detail'){
    const lesson=lessons.find(l=>l.id===Number(el.dataset.id));
    if(lesson?.type==='Pastoral Visit'){
      const section=document.createElement('section');section.className='panel';section.style='padding:14px;margin:18px 0;background:var(--bg)';
      section.innerHTML='<span class="eyebrow">Already in your Verse Library</span><p class="small" style="margin:9px 0">A matching reference was found in a spreadsheet import. Compare the two wordings before confirming this visit.</p><div class="row wrap"><button class="btn compact" data-action="use-existing">Use existing verse</button><button class="btn compact" data-action="keep-both">Keep both</button></div><p id="comparison-choice" class="small muted" style="margin:9px 0 0">Choose which record belongs to this visit.</p>';
      $('#checked-lesson').closest('label').before(section);
    }
  }
  if(el.dataset.action==='use-existing'||el.dataset.action==='keep-both'){
    $('#comparison-choice').textContent=el.dataset.action==='use-existing'?'Existing verse selected. This visit would be added as another source.':'Both wordings selected. Each would retain its own source.';
    el.parentElement.querySelectorAll('button').forEach(b=>{b.classList.toggle('primary',b===el);b.setAttribute('aria-pressed',String(b===el))});
  }
});
$('#global-search').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value;go('search');s.q=q;render();$('#full-search').focus()}});
$('#file-picker').addEventListener('change',e=>{if(!e.target.files.length)return;const kind=e.target.dataset.kind;if(kind==='sheet'){s.importStep=2;go('import');toast(`${e.target.files[0].name} selected. The preview shows illustrative rows only.`)}else{if($('#dialog').open)$('#dialog').close();detail(1);toast(`${e.target.files.length} file${e.target.files.length>1?'s':''} selected. Showing a sample checking flow; no file was read.`)}e.target.value=''});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#dialog').close()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#global-search').focus()}if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('#nav-backdrop').classList.remove('show')}});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));go(location.hash.slice(1)||'home');
</script>
