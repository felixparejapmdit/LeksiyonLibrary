function assistantView(){const matches=state.suggestMore?verses.slice(0,6):verses.slice(0,3);return heading('Lesson Assistant','Start with an objective. Choose verses from your libraries. Shape a thoughtful outline.',button(icon('file')+' Saved drafts'+(state.saved.length?' ('+state.saved.length+')':''),'saved-drafts')+'<span class="tag green">'+icon('spark')+' Local AI ready</span>','Prepare')+'<div class="stepper" aria-label="Preparation steps">'+button('<span>01</span> Define your purpose','step','active','data-step="definition"')+'<i class="step-line"></i>'+button('<span>02</span> Choose your verses','step','','data-step="suggestions"')+'<i class="step-line"></i>'+button('<span>03</span> Shape the outline','step','','data-step="outline"')+'</div><div class="assistant-grid"><section class="panel definition-panel sticky" id="definition"><div class="form-section"><div class="form-top"><span class="section-number">01 / PURPOSE</span><h2>What will you teach?</h2></div>'+field('Lesson title','drafttitle',state.title)+field('Issue or situation','draftissue',state.issue,true)+'<div class="objectives-wrap"><div class="row between"><label class="field-label">Objectives</label><span class="small muted">'+state.objectives.length+' / 4</span></div>'+state.objectives.map((o,i)=>'<div class="objective"><span class="objective-number">'+(i+1)+'</span><textarea class="field" id="objective'+i+'" data-objective="'+i+'" aria-label="Objective '+(i+1)+'">'+esc(o)+'</textarea>'+(state.objectives.length>1?button('×','remove-objective','objective-remove','data-index="'+i+'" aria-label="Remove objective '+(i+1)+'"'):'')+'</div>').join('')+button(icon('plus')+' Add objective','add-objective','btn plain small mt8',state.objectives.length>=4?'disabled':'')+'</div></div><div class="form-foot">'+button(icon('spark')+' Find matching verses','suggest','btn primary full')+'<p class="context-note">Suggestions come from your libraries. Scripture wording stays exactly as stored.</p></div></section>< function overviewView(){return heading('A clear desk for your next lesson.','Your archives, preparation, and review queue — brought together in one place.',button(icon('upload')+' Add a lesson','upload','btn')+viewButton(icon('plus')+' Prepare a lesson','assistant','btn primary'),'Library')+'<div class="metric-row"><div class="metric"><span class="eyebrow">LESSON ARCHIVE</span><strong>'+lessons.filter(l=>l.type==='lesson').length+'</strong><span class="small muted">Worship service lessons</span></div><div class="metric"><span class="eyebrow">PASTORAL VISITS</span><strong>'+lessons.filter(l=>l.type==='visit').length+'</strong><span class="small muted">Across 2 districts</span></div><div class="metric"><span class="eyebrow">VERSE COLLECTION</span><strong>'+verses.length+'</strong><span class="small muted">Two libraries, clearly labeled</span></div><div class="metric"><span class="eyebrow">REVIEW QUEUE</span><strong>'+verses.filter(v=>v.status!=='verified').length+'</strong><span class="small muted">A little progress each day</span></div></div><div class="dashboard-columns"><div class="stack gap20"><section class="continue-card"><span class="eyebrow">PICK UP WHERE YOU LEFT OFF</span><h2>'+esc(state.title)+'</h2><p>'+state.objectives.length+' objectives. '+state.selected.length+' verses selected. Your next step is to shape the outline.</p>'+viewButton('Continue preparing '+icon('arrow'),'assistant','btn')+'</section><section class="panel"><div class="panel-head row between"><h2>Recent additions</h2>'+viewButton('View Lesson Library '+icon('arrow'),'lessons','btn plain small')+'</div>'+lessons.slice(0,4).map(lessonRow).join('')+'</section></div><aside class="stack gap20"><section class="panel"><div class="panel-head"><h2>A few things to finish</h2></div><div class="panel-body"><div class="task-row"><span class="task-icon amber">'+icon('file')+'</span><div><h3>Check 2 new documents</h3><p>Confirm what was read from the PDF.</p></div>'+button(icon('chevron'),'check-first', case'sample-restore':closeDialog();toast('Sample restore preview complete. Your real vault is unchanged.');break;
}});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='drafttitle'){state.title=el.value;const title=$('#outline .outline-title');if(title)title.textContent=el.value||'Untitled lesson';}else if(el.id==='draftissue')state.issue=el.value;else if(el.dataset.objective!==undefined){state.objectives[Number(el.dataset.objective)]=el.value;const part=$('#outline')?.querySelectorAll('.outline-part')[Number(el.dataset.objective)];if(part?.nextElementSibling)part.nextElementSibling.textContent=el.value||'Add an objective';}else if(el.id==='versequery'){state.q=el.value;state.page=1;render();}else if(el.id==='lessonsearch'){state.lessonq=el.value;render();}else if(el.id==='searchfield'){state.search=el.value;state.meaning=false;render();}else if(el.id==='reviewdraft')state.reviewDraft=el.value;});
document.addEventListener('change',event=>{const el=event.target,maps={verselanguage:'language',versetranslation:'translation',versestatus:'status',versesource:'source',lessonstatus:'lessonstatus'};if(maps[el.id]){state[maps[el.id]]=el.value;state.page=1;render();}else if(el.id==='reviewlibrary'){state.reviewLibrary=el.value;state.reviewIndex=0;state.reviewCompared=false;state.reviewDraft='';render();}else if(el.id==='compared'){state.reviewCompared=el.checked;render();}else if(el.id==='sheetfile'&&el.files[0]){state.importFile=el.files[0].name;state.importStep=1;render();toast('Filename selected. The preview uses illustrative rows only.');el.value='';}else if(el.id==='pdffile'&&el.files[0]){$('#chosenpdf').textContent=el.files[0].name+' selected. Continue with the sample document.';el.value='';}else if(el.id==='restorefile'&&el.files[0]){$('#restorechosen').textContent=el.files[0].name+' selected. No file contents were read.';el.value='';}else if(el.id==='aimodel')toast('Model preference shown for demonstration only.');});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if($('#dialog').open)closeDialog();navigate('search');}});
$('#dialog').addEventListener('click',event=>{if(event.target===$('#dialog')){const rect=$('#dialog').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog();}});
hydrateIcons();render();
</script>
</body>
</html>
