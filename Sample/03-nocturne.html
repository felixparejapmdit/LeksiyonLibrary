<body>

<script>
'use strict';
const icons={library:'<path d="M4 5h5l3 2 3-2h5v15h-5l-3 2-3-2H4zM12 7v15"/>',review:'<path d="M9 5H5v16h14V5h-4M9 3h6v4H9zM8 13l2 2 5-5"/>',assistant:'<path d="M5 4h10l4 4v13H5zM15 4v5h4M8 13h8M8 17h6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',settings:'<path d="m9 3-1 3-3 1-2 4 2 2v3l4 3 3-1 3 1 4-3v-3l2-2-2-4-3-1-1-3z"/><circle cx="12" cy="12" r="3"/>',archive:'<path d="M4 7h16v14H4zM3 3h18v4H3zM9 11h6"/>',visit:'<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/>',verse:'<path d="M6 3h12v18l-6-4-6 4z"/>',import:'<path d="M4 16v5h16v-5M12 3v13m-5-5 5 5 5-5"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',left:'<path d="M19 12H5m5-5-5 5 5 5"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',edit:'<path d="m15 4 5 5-11 11H4v-5zM12 7l5 5"/>',copy:'<path d="M8 8h12v13H8zM4 16V3h12"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',doc:'<path d="M5 3h9l5 5v13H5zM14 3v6h5M8 13h8M8 17h5"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',up:'<path d="M12 20V4m-5 5 5-5 5 5"/>',down:'<path d="M12 4v16m-5-5 5 5 5-5"/>',reset:'<path d="M4 4v6h6M4 10a8 8 0 1 1 1 8"/>',upload:'<path d="M4 16v5h16v-5M12 16V3m-5 5 5-5 5 5"/>'};
const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.doc}</svg>`;
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const verses=[
{id:1,ref:'Genesis 6:8',number:'8',text:'Ang mga bantay ay nanatiling handa sa pintuan ng bayan.',version:'T4T',lang:'Tagalog',origin:'Excel import',source:'Study collection.xlsx · row 141',scope:'verse',verified:false},
{id:2,ref:'Genesis 6:20',number:'20',text:'Ang bawat manggagawa ay nagbahagi ng kaniyang kaalaman sa kapwa.',version:'T4T',lang:'Tagalog',origin:'Pastoral visit PDF',source:'A visit to remember.pdf · page 2',scope:'verse',verified:false},
{id:3,ref:'I Hari 17:4',number:'4',text:'In this sample passage, the watchmen prepared a place for everyone.',version:'NIRV',lang:'English',origin:'Lesson Library',source:'A place for service.pdf · page 1',scope:'lesson',verified:false},
{id:4,ref:'II Hari 5:15',number:'15',text:'Ang aral na ito ay nagpaalala sa lahat na maging mapagpasalamat.',version:'T4T',lang:'Tagalog',origin:'Lesson Library',source:'Learning to give thanks.pdf · page 3',scope:'lesson',verified:false},
{id:5,ref:'Roma 12:6',number:'6',text:'The people listened carefully and worked together throughout the day.',version:'AMP',lang:'English',origin:'Excel import',source:'Study collection.xlsx · row 146',scope:'verse',verified:true},
{id:6,ref:'Juan 15:16',number:'16',text:'Ang mga mag-aaral ay masayang nagtulungan sa kanilang paghahanda.',version:'T4T',lang:'Tagalog',origin:'Pastoral visit PDF',source:'Preparing with care.pdf · page 1',scope:'verse',verified:true}
];
const lessons=[
{id:1,title:'Learning to give thanks',subtitle:'A thoughtful response to the blessings we receive',type:'Weekend',date:'Nov 8, 2026',year:'2026',verses:6,checked:false},
{id:2,title:'A place for service',subtitle:'Using what we have to help those around us',type:'Midweek',date:'Nov 4, 2026',year:'2026',verses:8,checked:true},
{id:3,title:'A visit to remember',subtitle:'North district · Riverside congregation',type:'Pastoral visit',date:'Oct 25, 2026',year:'2026',verses:5,checked:false},
{id:4,title:'Preparing with care',subtitle:'Central district · Hillview congregation',type:'Pastoral visit',date:'Sep 20, 2026',year:'2026',verses:4,checked:true},
{id:5,title:'Faithful in the small things',subtitle:'A collection of lessons on everyday service',type:'Weekend',date:'Dec 14, 2025',year:'2025',verses:7,checked:true},
{id:6,title:'Room for reflection',subtitle:'South district · Lakeside congregation',type:'Pastoral visit',date:'Nov 9, 2025',year:'2025',verses:5,checked:true}
];
const pageNames={overview:'Overview',archives:'All Archives',lessons:'Lesson Library',visits:'Pastoral Visits',lessonverses:'Verses from lessons',verses:'Verse Library',assistant:'Lesson Assistant',review:'Review Verses',import:'Import Verses',search:'Search',settings:'Settings'};
const state={view:'review',review:0,reviewLibrary:'verse',compared:false,side:'wording',details:false,versePage:1,layout:'cards',query:'',filter:'all',year:'all',reviewed:new Set(),added:[4],objectives:['Encourage a spirit of thankfulness'],draftTitle:'The practice of gratitude',draftIssue:'How can we appreciate the opportunities we have?',suggestions:true,importReady:false,importDone:false,fileName:'',font:23,ai:true,warm:false,saved:false};
const navGroups=[['Library',[['overview','library','Overview',''],['archives','archive','All Archives','6'],['lessons','library','Lesson Library','3'],['lessonverses','verse','Verses from lessons','2'],['visits','visit','Pastoral Visits','3'],['verses','verse','Verse Library','4'],['import','import','Import Verses','']]],['Study tools',[['assistant','assistant','Lesson Assistant',''],['review','review','Review Verses','4'],['search','search','Search','']]],['Workspace',[['settings','settings','Settings','']]]];
function nav(){document.getElementById('navigation').innerHTML=navGroups.map(([heading,items])=>`<div class="nav-group"><div class="nav-label">${heading}</div>${items.map(([id,ico,label,count])=>`<button class="nav-item ${id===state.view?'active':''} ${id==='lessonverses'?'child':''}" data-view="${id}" ${id===state.view?'aria-current="page"':''}>${id==='lessonverses'?'':icon(ico)}<span>${label}</span>${count?`<span class="nav-count">${id==='review'?verses.filter(v=>!v.verified).length:count}</span>`:''}</button>`).join('')}</div>`).join('');document.getElementById('breadcrumb').textContent=pageNames[state.view];document.querySelectorAll('[data-rail]').forEach(el=>{el.innerHTML=icon(el.dataset.rail);el.classList.toggle('active',el.dataset.view===state.view||el.dataset.rail==='library'&&['overview','lessons','visits','verses','lessonverses','import'].includes(state.view))});document.querySelector('.mobile-menu').innerHTML=icon('menu');const checked=verses.filter(v=>v.verified).length;document.getElementById('navProgress').textContent=`${checked} of ${verses.length} checked`;document.getElementById('navProgressBar').style.width=`${checked/verses.length*100}%`;}
function go(view){state.view=view;state.query='';state.versePage=1;state.filter='all';state.year='all';document.getElementById('shell').classList.remove('nav-open');draw();window.scrollTo({top:0});document.getElementById('content').focus({preventScroll:true});}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('visible'),3700);}
function modal(title,subtitle,body,actions=''){document.getElementById('modalContent').innerHTML=`<header class="modal-head"><div><h2 id="modalTitle">${title}</h2><p>${subtitle}</p></div><button class="button square ghost" data-action="close" aria-label="Close dialog">${icon('close')}</button></header><div class="modal-body">${body}</div><footer class="modal-actions"><button class="button" data-action="close">Close</button>${actions}</footer>`;document.getElementById('modal').showModal();}
function previewNote(){return '<div class="demo-note" style="margin-top:22px">Design preview · Sample data and illustrative wording only · 03 Nocturne</div>';}
function heading(kicker,title,description,actions=''){return `<header class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${description}</p></div>${actions?`<div class="row">${actions}</div>`:''}</header>`;}
function verseText(v){return `<sup>${esc(v.number)}</sup>${esc(v.text)}`;}
function reviewQueue(){return verses.filter(v=>v.scope===state.reviewLibrary&&!v.verified);}
function currentVerse(){const queue=reviewQueue();state.review=Math.min(state.review,Math.max(0,queue.length-1));return queue[state.review];}
function sourcePaper(v){return `<div class="source-paper"><div class="row between sheet-meta"><span>${v.origin==='Excel import'?'Translation collection':'Study document'}</span><span>Sample source</span></div><h3 class="sheet-title serif">A passage for reflection</h3><div style="font-size:10px;color:#707965">${esc(v.source)}</div><div class="sheet-rule"></div><div style="font-size:11px;font-weight:600">${esc(v.ref)} &nbsp; · &nbsp; ${v.version}</div><div class="sheet-cell"><p class="reading">${verseText(v)}</p></div><div style="font-size:8px;margin-top:20px;letter-spacing:.3px;color:#7e8675">ILLUSTRATIVE WORDING · NOT AN OFFICIAL BIBLE EXCERPT</div></div>`;}
function reviewPage(){const v=currentVerse();const queue=reviewQueue();if(!v)return `${heading('Review desk','A clearer library, one verse at a time.','Your sample queue is complete. Explore the other library or return to your collection.')}<div class="completed">${icon('check')}<h2>All caught up.</h2><p class="muted" style="margin:15px 0 25px">There are no more unchecked verses in this sample library.</p><button class="button primary" data-action="review-library" data-value="${state.reviewLibrary==='verse'?'lesson':'verse'}">Review ${state.reviewLibrary==='verse'?'lesson':'imported'} verses ${icon('arrow')}</button></div>${previewNote()}`;return `
  <header class="page-head review-head"><div><div class="eyebrow">The review desk</div><div class="review-title"><h1>One passage. A clear decision.</h1><span class="review-count">${state.review+1} / ${queue.length}</span></div><p>Compare the source, correct the wording, and keep what you can trust.</p></div><button class="button ghost" data-action="details">${icon('eye')} ${state.details?'Hide':'Record'} details</button></header>
  <div class="review-tools"><div class="segmented" aria-label="Review library"><button class="${state.reviewLibrary==='verse'?'selected':''}" data-action="review-library" data-value="verse">Verse Library <span class="quiet">${verses.filter(v=>v.scope==='verse'&&!v.verified).length}</span></button><button class="${state.reviewLibrary==='lesson'?'selected':''}" data-action="review-library" data-value="lesson">Lesson Library <span class="quiet">${verses.filter(v=>v.scope==='lesson'&&!v.verified).length}</span></button></div><div class="text-controls"><button data-action="font" data-value="-1" aria-label="Decrease reading text size">A−</button><span>Reading size</span><button data-action="font" data-value="1" aria-label="Increase reading text size" style="font-size:16px">A+</button></div></div>
  <div class="compare-mobile-tabs"><button class="${state.side==='source'?'active':''}" data-action="compare-side" data-value="source">Original source</button><button class="${state.side==='wording'?'active':''}" data-action="compare-side" data-value="wording">Verse wording</button></div>
  <div class="comparison" data-side="${state.side}">
    <section class="source-panel"><div class="panel-bar"><span class="eyebrow">01 &nbsp; <strong>Original source</strong></span><span class="pill">${v.origin==='Excel import'?'Excel cell':'PDF page'}</span></div><div class="source-content">${sourcePaper(v)}</div><div class="source-footer"><span>${esc(v.source)}</span><button class="button ghost" data-action="source" data-id="${v.id}">${icon('eye')} Expand</button></div></section>
    <section class="reading-panel"><div class="panel-bar"><span class="eyebrow">02 &nbsp; <strong>Verse wording</strong></span><span class="pill amber">Awaiting review</span></div><div class="clean-content"><div class="verse-reference"><h2>${esc(v.ref)}</h2><span class="translation">${v.version}</span><span class="muted" style="font-size:10px;margin-left:auto">${v.lang}</span></div><p class="reading" id="liveReading">${verseText(v)}</p><div class="row wrap" style="gap:6px"><span class="pill">${v.origin}</span><span class="quiet" style="font-size:10px">Original text retained</span></div><details class="edit-disclosure"><summary>Correct the wording ${icon('edit')}</summary><label class="caption" style="margin-top:15px">Reference<input class="field" id="reviewReference" value="${esc(v.ref)}"></label><label class="caption" style="margin-top:13px">Verse text<textarea class="field" id="reviewText">${esc(v.text)}</textarea></label><button class="button" data-action="save-correction" data-id="${v.id}" style="margin-top:12px">Save sample correction</button></details></div><div class="source-footer"><span>Scripture stays separate from AI notes.</span><span>${icon('lock')}</span></div></section>
  </div>
  ${state.details?`<div class="record-meta"><div><small>Library</small><span>${v.scope==='lesson'?'Lesson Library':'Verse Library'}</span></div><div><small>Translation</small><span>${v.version} · ${v.lang}</span></div><div><small>Reference</small><span>${esc(v.ref)}</span></div><div><small>Original file</small><span>${esc(v.source)}</span></div></div>`:''}
  <div class="check-row"><label class="check"><input type="checkbox" id="compared" ${state.compared?'checked':''}><span>I compared the wording with its original source.<small>Check the reference and every word before verifying.</small></span></label><span class="note">Verified wording is locked permanently<br>in the working app.</span></div>
  <div class="queue-label"><span>Up next in your queue</span><span>${queue.length} awaiting review</span></div><div class="queue-strip">${queue.slice(0,4).map((item,i)=>`<button class="queue-card ${i===state.review?'active':''}" data-action="queue" data-value="${i}"><span class="queue-num">0${i+1}</span><strong>${esc(item.ref)}</strong><small>${item.version} · ${item.origin}</small></button>`).join('')}${queue.length<3?`<div class="queue-card" style="border-style:dashed"><strong style="color:var(--quiet)">A little progress, every day.</strong><small>Take your time. Accuracy comes first.</small></div>`:''}</div>
  <footer class="dock"><div class="row"><button class="button" data-action="review-prev" ${state.review===0?'disabled':''}>${icon('left')} Previous</button><button class="button ghost" data-action="review-next">Skip for now ${icon('arrow')}</button></div><span class="hint"><kbd>←</kbd> <kbd>→</kbd> Move through queue</span><button class="button primary" id="verifyButton" data-action="verify" ${!state.compared?'disabled':''}>${icon('check')} Verify & lock</button></footer>${previewNote()}`;}

function assistantPage(){return `${heading('A space to prepare','Give your next lesson a little structure.','Start with a clear objective. Gather passages from your libraries, then shape the outline.',`<button class="button" data-action="save-draft">${icon('check')} ${state.saved?'Draft saved':'Save draft'}</button><button class="button primary" data-action="outline-preview">Preview ${icon('arrow')}</button>`)}<div class="outline-workspace"><section class="stack"><div class="card stack"><div class="assistant-step"><span>1</span><strong>Set the direction</strong><span style="margin-left:auto;border:0;color:var(--quiet);width:auto">Up to 4 objectives</span></div><label class="caption">Lesson title<input class="field" id="draftTitle" value="${esc(state.draftTitle)}" placeholder="Give your lesson a title"></label><label class="caption">The issue or situation<textarea class="field" id="draftIssue" style="min-height:75px">${esc(state.draftIssue)}</textarea></label>${state.objectives.map((o,i)=>`<label class="caption">Objective ${i+1}<div class="row"><input class="field objective-input" data-index="${i}" value="${esc(o)}" placeholder="What should this lesson teach?">${i>0?`<button class="button square ghost" data-action="remove-objective" data-id="${i}" aria-label="Remove objective ${i+1}">${icon('close')}</button>`:''}</div></label>`).join('')}<div class="row between"><button class="button ghost" data-action="add-objective" ${state.objectives.length>=4?'disabled':''}>${icon('plus')} Add objective</button><button class="button" data-action="suggest">Find passages ${icon('arrow')}</button></div></div><div class="card"><div class="row between"><div class="eyebrow muted">2 &nbsp; Gather your passages</div><span class="pill green">Library results</span></div>${state.suggestions?verses.slice(1,5).map(v=>`<article class="suggestion"><div class="row between"><h3>${v.ref} <span class="translation">${v.version}</span></h3><button class="button ${state.added.includes(v.id)?'success' function draw(restoreFocus=false){let focus,selection;if(restoreFocus){focus=document.activeElement?.id;try{selection=document.activeElement?.selectionStart}catch{}}nav();const views={overview:overviewPage,archives:lessonsPage,lessons:lessonsPage,visits:lessonsPage,verses:versesPage,lessonverses:versesPage,review:reviewPage,assistant:assistantPage,import:importPage,search:searchPage,settings:settingsPage};document.getElementById('content').dataset.currentView=state.view;document.getElementById('content').innerHTML=(views[state.view]||overviewPage)();if(focus){const el=document.getElementById(focus);el?.focus();try{el?.setSelectionRange(selection,selection)}catch{}}}
function showSource(id){const v=verses.find(v=>v.id===id);if(!v)return;modal(v.ref,`${v.version} · ${v.origin} · ${v.lang}`,`<div class="source-content" style="border-radius:8px">${sourcePaper(v)}</div><p class="note" style="margin-top:18px">This is an illustrative source card. The working app opens the original PDF page or spreadsheet cell.</p>`,`<button class="button" data-action="copy-verse" data-id="${v.id}">${icon('copy')} Copy sample text</button>`);}
function lessonDetail(id){const l=lessons.find(l=>l.id===id);if(!l)return;const isVisit=l.type==='Pastoral visit';modal(l.title,'Compare the source and details before confirming the record.',`<div class="grid2"><div class="doc-preview"><p class="eyebrow" style="font-size:8px;text-align:center">Sample document · Page 1</p><h2 style="font-size:20px;margin:25px 0 20px">${esc(l.title)}</h2><h3>Introduction / Pasimula</h3><p>What can we learn from a spirit of service?</p><h3>II Hari 5:15 · T4T</h3><p><sup>15</sup>Ang aral na ito ay nagpaalala sa lahat na maging mapagpasalamat.</p><p style="font:9px Arial,sans-serif;margin-top:26px">ILLUSTRATIVE WORDING · DESIGN PREVIEW</p></div><div class="stack"><label class="caption">Title<input class="field" id="lessonTitle" value="${esc(l.title)}"></label><label class="caption">Category<select class="field"><option>${l.type}</option><option>${isVisit?'Midweek':'Pastoral visit'}</option></select></label><label class="caption">Date<input class="field" type="date" value="2026-11-08"></label>${isVisit?'<label class="caption">Local congregation<input class="field" value="Riverside"></label><label class="caption">District<input class="field" value="North district"></label>':'<label class="caption">Objective<input class="field" value="Encourage a spirit of thankfulness"></label>'}<p class="note">Check the title, date, objectives, and every passage against the original.</p><span class="pill ${l.checked?'green':'amber'}" style="justify-self:start">${l.checked?'Checked':'Needs checking'}</span></div></div>`,`<button class="button primary" data-action="check-lesson" data-id="${id}">${icon('check')} Confirm sample record</button>`);}
function previewOutline(){modal(state.draftTitle||'Untitled lesson','Reading preview · Only passages from this sample collection.',`<article class="doc-preview" id="outlineDocument"><h2>${esc(state.draftTitle)||'Untitled lesson'}</h2><p><strong>Issue</strong><br>${esc(state.draftIssue)}</p><h3>Objectives</h3>${state.objectives.map((o,i)=>`<p>${i+1}. ${esc(o)}</p>`).join('')}<h3>Introduction / Pasimula</h3>${state.added.map((id,i)=>{const v=verses.find(x=>x.id===id);return `<h3>${String.fromCharCode(65+i)}. ${v.ref} · ${v.version}</h3><p class="reading">${verseText(v)}</p>`;}).join('')||'<p>Add a passage to your outline to see it here.</p>'}<p style="font:10px Arial,sans-serif;margin-top:25px;color:#6d7565">ILLUSTRATIVE WORDING · SAMPLE DATA ONLY</p></article>`,`<button class="button" data-action="print">Print preview</button><button class="button primary" data-action="export-outline">${icon('download')} Export sample text</button>`);}
function visitComparison(){state.duplicateChoice='';const v=verses[1];const doc=document.querySelector('#modal .doc-preview');doc.querySelectorAll('h3')[1].textContent=`${v.ref} · ${v.version}`;doc.querySelectorAll('p')[2].innerHTML=verseText(v);document.querySelector('#modal .modal-body').insertAdjacentHTML('beforeend',`<section class="card" style="margin-top:22px;border-color:#786743"><span class="pill amber">Compare with an existing passage</span><h3 style="margin-top:15px">${v.ref} already exists in the Verse Library.</h3><p class="note" style="margin-top:9px">Keep the visit and its date attached to the right wording. This choice does not overwrite the existing verse.</p><div class="grid2" style="margin-top:20px"><div><div class="eyebrow quiet" style="font-size:8px">Read from this PDF · T4T</div><p class="verse-copy" style="font-size:16px;margin-top:10px">${verseText(v)}</p></div><div><div class="eyebrow quiet" style="font-size:8px">Existing Verse Library record · T4T</div><p class="verse-copy" style="font-size:16px;margin-top:10px">${verseText(v)}</p></div></div><div class="row wrap" style="margin-top:20px"><button class="button" data-action="use-existing">Use existing verse</button><button class="button" data-action="keep-both">Keep both</button><span id="duplicateStatus" class="note" aria-live="polite">Choose before confirming.</span></div></section>`);}
document.addEventListener('click',async event=>{const link=event.target.closest('[data-view]');if(link){go(link.dataset.view);return;}const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;const value=button.dataset.value;const id=Number(button.dataset.id);switch(action){
case'menu':document.getElementById('shell').classList.toggle('nav-open');break;
case'close':document.getElementById('modal').close();break;
case'demo':toast(button.dataset.message||'This control is a design preview. Your real collection is unchanged.');break;
case'details':state.details=!state.details;draw();break;
case'font':state.font=Math.min(31,Math.max(18,state.font+Number(value)));document.documentElement.style.setProperty('--read-size',state.font+'px');if(state.view==='settings')draw();toast(`Reading size: ${state.font}px`);break;
case'review-library':state.reviewLibrary=value;state.review=0;state.compared=false;draw();break;
case'compare-side':state.side=value;draw();break;
case'queue':state.review=Number(value);state.compared=false;draw();break;
case'review-prev':state.review=Math.max(0,state.review-1);state.compared=false;draw();break;
case'review-next':{const q=reviewQueue();if(state.review<q.length-1){state.review++;state.compared=false;draw()}else toast('You are at the last unchecked passage in this sample queue.');break;}
case'verify':{const v=currentVerse();if(!v||!state.compared)return;modal('Verify this passage?','In the working app, verifying permanently locks the reference and wording.',`<div class="card soft"><h3>${v.ref} · ${v.version}</h3><p class="verse-copy" style="margin-top:15px">${verseText(v)}</p></div><p class="note" style="margin-top:18px">This prototype updates sample data in memory only. No real verse is changed.</p>`,`<button class="button primary" data-action="confirm-verify" data-id="${v.id}">${icon('lock')} Verify sample passage</button>`);break;}
case'confirm-verify':{const v=verses.find(v=>v.id===id);v.verified=true;state.compared=false;document.getElementById('modal').close();draw();toast(`${v.ref} marked as verified in this preview.`);break;}
case'save-correction':{const v=verses.find(v=>v.id===id);const text=document.getElementById('reviewText').value.trim();const ref=document.getElementById('reviewReference').value.trim();if(!text||!ref){toast('Keep both a reference and verse wording before saving.');break;}v.text=text;v.ref=ref;state.compared=false;draw();toast('Sample correction saved. Compare it again before verifying.');break;}
case'source':showSource(id);break;
case'lesson-detail':lessonDetail(id);if(lessons.find(l=>l.id===id)?.type==='Pastoral visit')visitComparison();break;
case'use-existing':case'keep-both':state.duplicateChoice=action;document.getElementById('duplicateStatus').textContent=action==='use-existing'?'Existing wording selected.':'Both records will be kept.';document.querySelectorAll('[data-action="use-existing"],[data-action="keep-both"]').forEach(el=>el.classList.toggle('success',el.dataset.action===action));break;
case'check-lesson':{const l=lessons.find(l=>l.id===id);if(l.type==='Pastoral visit'&&!state.duplicateChoice){toast('Choose whether to use the existing verse or keep both records.');document.getElementById('duplicateStatus').scrollIntoView({block:'center'});break;}l.title=document.getElementById('lessonTitle').value.trim()||l.title;l.checked=true;document.getElementById('modal').close();draw();toast('This sample document is now marked as checked.');break;}
case'copy-verse':{const v=verses.find(v=>v.id===id);const text=`${v.ref} (${v.version})\n${v.number}${v.text}`;try{await navigator.clipboard.writeText(text);toast('Sample passage copied.')}catch{modal('Copy this sample passage','Your browser may restrict clipboard access for local HTML files.',`<textarea class="field" readonly aria-label="Sample passage to copy">${esc(text)}</textarea>`);}break;}
case'upload':modal('Add your documents','A quiet, guided upload step for lessons and pastoral visits.',`<div class="dropzone" style="padding:30px 20px">${icon('upload')}<h3>Choose PDFs to add to your collection.</h3><p>The working app reads each file, then asks you to check the result.</p><button class="button primary" data-action="choose-pdf">Browse sample files</button></div><p class="note" style="margin-top:17px">Design preview only. A selected file stays on your computer and is not read or uploaded.</p>`);break;
case'choose-pdf':document.getElementById('filePicker').accept='.pdf';document.getElementById('filePicker').dataset.mode='pdf';document.getElementById('filePicker').click();break;
case'year':state.year=value;draw();break;
case'layout':state.layout=value;state.versePage=1;draw();break;
case'page':state.versePage=Math.max(1,Number(value));draw();document.querySelector('.toolbar')?.scrollIntoView({block:'start'});break;
case'add-objective':if(state.objectives.length<4){state.objectives.push('');draw();document.querySelectorAll('.objective-input')[state.objectives.length-1]?.focus()}break;
case'remove-objective':state.objectives.splice(id,1);draw();break;
case'suggest':state.suggestions=true;draw();toast('Showing illustrative passages from both sample libraries.');break;
case'add-verse':if(!state.added.includes(id)){state.added.push(id);state.saved=false;draw();toast('Passage added to the outline.')}break;
case'remove-verse':state.added=state.added.filter(x=>x!==id);state.saved=false;draw();break;
case'move-verse':{const index=state.added.indexOf(id),next=index+Number(value);if(next>=0&&next<state.added.length){[state.added[index],state.added[next]]=[state.added[next],state.added[index]];state.saved=false;draw()}break;}
case'save-draft':if(!state.draftTitle.trim()){toast('Give your lesson a title before saving.');document.getElementById('draftTitle').focus();break;}state.saved=true;draw();toast('Draft saved in this preview. It resets when you reload.');break;
case'outline-preview':previewOutline();break;
case'print':window.print();break;
case'export-outline':{const text=`${state.draftTitle}\n\n${state.draftIssue}\n\nOBJECTIVES\n${state.objectives.map((x,i)=>`${i+1}. ${x}`).join('\n')}\n\n${state.added.map(id=>{const v=verses.find(x=>x.id===id);return `${v.ref} (${v.version})\n${v.number}${v.text}`}).join('\n\n')}\n\nILLUSTRATIVE SAMPLE DATA ONLY`;const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Nocturne-sample-outline.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('A plain-text sample outline was downloaded.');break;}
case'context':{const v=verses.find(x=>x.id===id);modal(`Context · ${v.ref}`,'AI context is separate from scripture and needs its own review.',`<span class="pill amber">AI context · Review before use</span><div class="stack" style="margin-top:22px"><div><h3>Speaker</h3><p class="note" style="margin-top:7px">The speaker should be checked against your source.</p></div><div><h3>Book context</h3><p class="note" style="margin-top:7px">A sample reading note about ${v.ref.includes('Hari')?v.ref.split(' ').slice(0,2).join(' '):v.ref.split(' ')[0]}. Official book names remain I Hari and II Hari.</p></div><div><h3>Chapter context</h3><p class="note" style="margin-top:7px">In the working app, context is shared by verses in the same chapter and can be corrected.</p></div></div>`,`<button class="button" data-action="demo" data-message="In the working app, your correction is saved separately from the verse wording.">Review or correct</button>`);break;}
case'choose-import':document.getElementById('filePicker').accept='.xlsx,.xls';document.getElementById('filePicker').dataset.mode='import';document.getElementById('filePicker').click();break;
case'sample-import':state.importReady=true;state.importDone=false;state.fileName='Sample collection.xlsx';draw();break;
case'reset-import':state.importReady=false;state.importDone=false;draw();break;
case'commit-import':state.importDone=true;draw();toast('Sample import completed. Your real Verse Library is unchanged.');break;
case'search-term':state.query=value;draw();document.getElementById('globalSearch').focus();break;
case'meaning':if(!state.query){toast('Enter a question or phrase to search by meaning.');document.getElementById('globalSearch').focus()}else toast(`Meaning search for “${state.query}” would use your local AI. This preview shows text matches.`);break;
case'warm':state.warm=!state.warm;document.documentElement.style.setProperty('--bg',state.warm?'#211f1a':'#171a1a');document.documentElement.style.setProperty('--panel',state.warm?'#28251e':'#1d2120');draw();break;
case'toggle-ai':state.ai=!state.ai;draw();toast('Local AI status changed for this preview only.');break;
case'toggle-setting':button.classList.toggle('on');button.setAttribute('aria-checked',button.classList.contains('on'));toast('Preference changed for this preview.');break;
case'backup':modal('Create an encrypted backup','Protect a copy beyond this computer.',`<p class="note" style="margin-bottom:20px">In the working app, choose a passphrase you can remember. It will be needed when restoring the backup.</p><label class="caption">Backup passphrase<input class="field" type="password" id="backupPassphrase" autocomplete="new-password" placeholder="Enter a sample passphrase"></label><p class="note" style="margin-top:17px">Preview only. No real vault or credentials are accessed.</p>`,`<button class="button primary" data-action="backup-confirm">Create sample backup</button>`);break;
case'backup-confirm':document.getElementById('modal').close();toast('Backup flow previewed. No real backup was created.');break;
case'restore':modal('Restore a backup','Review this carefully in the working app.',`<p class="note">Restoring replaces the vault on this computer. A backup file and its passphrase would be required.</p><div class="card soft" style="margin-top:20px"><h3>Design preview only</h3><p class="note" style="margin-top:9px">Your real collection is never accessed by these HTML mockups.</p></div>`,`<button class="button" data-action="demo" data-message="The restore picker is a design demonstration. No collection will be replaced.">Choose backup file</button>`);break;
}});
document.addEventListener('input',event=>{const el=event.target;if(['lessonSearch','verseSearch','globalSearch'].includes(el.id)){state.query=el.value;state.versePage=1;draw(true)}else if(el.id==='draftTitle'){state.draftTitle=el.value;state.saved=false}else if(el.id==='draftIssue'){state.draftIssue=el.value;state.saved=false}else if(el.classList.contains('objective-input')){state.objectives[Number(el.dataset.index)]=el.value;state.saved=false}else if(el.id==='reviewText'){const v=currentVerse();document.getElementById('liveReading').innerHTML=`<sup>${v.number}</sup>${esc(el.value)}`;state.compared=false;document.getElementById('compared').checked=false;document.getElementById('verifyButton').disabled=true;}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='compared'){state.compared=el.checked;document.getElementById('verifyButton').disabled=!state.compared}else if(el.id==='lessonFilter'||el.id==='verseFilter'){state.filter=el.value;state.versePage=1;draw()}else if(el.id==='fixBook'&&el.value){toast(`Row 4 uses ${el.value} in this sample preview.`)}else if(el.id==='filePicker'){if(!el.files.length)return;const names=[...el.files].map(f=>f.name).join(', ');if(el.dataset.mode==='import'){state.fileName=names;state.importReady=true;state.importDone=false;go('import')}else{document.getElementById('modal').close();toast(`${el.files.length} file${el.files.length===1?'':'s'} selected: ${names}. Preview only; nothing was read.`)}el.value='';}});
document.addEventListener('keydown',event=>{if(event.target.matches('input,textarea,select')||document.getElementById('modal').open)return;if(event.key==='/'){event.preventDefault();go('search');document.getElementById('globalSearch').focus()}else if(state.view==='review'&&event.key==='ArrowRight'){document.querySelector('[data-action="review-next"]')?.click()}else if(state.view==='review'&&event.key==='ArrowLeft'){document.querySelector('[data-action="review-prev"]')?.click()}});
document.getElementById('modal').addEventListener('click',event=>{if(event.target.id==='modal'){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.target.close()}});
draw();
</script>
</body>
</html>
